<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Pedidos - Restaurante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.20/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dragula@3.7.3/dist/dragula.min.css" rel="stylesheet">
    <style id="app-style">
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f7f9fc;
        }
        
        .role-card {
            transition: all 0.3s ease;
        }
        
        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        
        .card-order {
            transition: all 0.2s;
        }
        
        .card-order:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .column-orders {
            min-height: 400px;
        }
        
        @keyframes highlight {
            0% { background-color: #fdba74; }
            100% { background-color: white; }
        }
        
        .highlight {
            animation: highlight 2s ease;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #10b981;
            color: white;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.3s ease-out;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        /* Estilos para arrastrar elementos */
        .gu-mirror {
            position: fixed !important;
            margin: 0 !important;
            z-index: 9999 !important;
            opacity: 0.8;
        }
        
        .gu-hide {
            display: none !important;
        }
        
        .gu-unselectable {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }
        
        .gu-transit {
            opacity: 0.2;
            -webkit-transform: rotate(2deg);
            transform: rotate(2deg);
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Sistema de Pedidos</h1>
            <p class="text-center text-gray-600 mb-8">Seleccione su rol para continuar</p>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="role-card bg-blue-50 rounded-lg p-6 border border-blue-200 cursor-pointer text-center" data-role="mesero">
                    <div class="text-blue-500 text-4xl mb-3">
                        <i class="fas fa-concierge-bell"></i>
                    </div>
                    <h3 class="font-semibold text-blue-800">Mesero</h3>
                </div>
                
                <div class="role-card bg-orange-50 rounded-lg p-6 border border-orange-200 cursor-pointer text-center" data-role="chef">
                    <div class="text-orange-500 text-4xl mb-3">
                        <i class="fas fa-utensils"></i>
                    </div>
                    <h3 class="font-semibold text-orange-800">Chef/Cocina</h3>
                </div>
                
                <div class="role-card bg-green-50 rounded-lg p-6 border border-green-200 cursor-pointer text-center" data-role="servicio">
                    <div class="text-green-500 text-4xl mb-3">
                        <i class="fas fa-cash-register"></i>
                    </div>
                    <h3 class="font-semibold text-green-800">Servicio al Cliente</h3>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Dashboard Screen (Initially Hidden) -->
    <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow">
            <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between">
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <i class="fas fa-utensils text-orange-500 mr-2"></i>
                        <h1 class="text-xl font-bold text-gray-800">Sistema de Pedidos</h1>
                    </div>
                    <button class="md:hidden text-gray-600 focus:outline-none" id="mobile-menu-button">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
                
                <div class="md:flex md:items-center mt-4 md:mt-0 hidden md:block" id="mobile-menu">
                    <div class="flex items-center">
                        <span id="role-badge" class="px-3 py-1 rounded-full text-sm font-medium mr-4"></span>
                        <button id="reload-history" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-md flex items-center">
                            <i class="fas fa-sync-alt mr-2"></i>
                            Recargar Historial
                        </button>
                        <button id="logout-button" class="ml-4 text-gray-600 hover:text-gray-800">
                            <i class="fas fa-sign-out-alt mr-1"></i>
                            Salir
                        </button>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 py-6">
            <!-- Mesero Controls -->
            <div id="mesero-controls" class="mb-6 hidden">
                <button id="nueva-orden-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-md flex items-center">
                    <i class="fas fa-plus mr-2"></i>
                    Nueva Orden
                </button>
            </div>
            
            <!-- Dashboard Grid -->
            <div class="grid dashboard-grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Pendiente Column -->
                <div class="column-container" id="pendiente-container">
                    <div class="bg-gray-50 border border-gray-200 rounded-lg overflow-hidden">
                        <div class="bg-yellow-100 px-4 py-3 border-b border-gray-200">
                            <h2 class="font-semibold text-yellow-800">Pendiente</h2>
                        </div>
                        <div class="column-orders overflow-y-auto p-3" id="pendiente-column">
                            <!-- Orders will be inserted here -->
                        </div>
                    </div>
                </div>
                
                <!-- En Preparación Column -->
                <div class="column-container" id="preparacion-container">
                    <div class="bg-gray-50 border border-gray-200 rounded-lg overflow-hidden">
                        <div class="bg-orange-100 px-4 py-3 border-b border-gray-200">
                            <h2 class="font-semibold text-orange-800">En Preparación</h2>
                        </div>
                        <div class="column-orders overflow-y-auto p-3" id="preparacion-column">
                            <!-- Orders will be inserted here -->
                        </div>
                    </div>
                </div>
                
                <!-- Listo Column -->
                <div class="column-container" id="listo-container">
                    <div class="bg-gray-50 border border-gray-200 rounded-lg overflow-hidden">
                        <div class="bg-green-100 px-4 py-3 border-b border-gray-200">
                            <h2 class="font-semibold text-green-800">Listo para Servir</h2>
                        </div>
                        <div class="column-orders overflow-y-auto p-3" id="listo-column">
                            <!-- Orders will be inserted here -->
                        </div>
                    </div>
                </div>
                
                <!-- Entregado Column -->
                <div class="column-container" id="entregado-container">
                    <div class="bg-gray-50 border border-gray-200 rounded-lg overflow-hidden">
                        <div class="bg-blue-100 px-4 py-3 border-b border-gray-200">
                            <h2 class="font-semibold text-blue-800">Entregadas</h2>
                        </div>
                        <div class="column-orders overflow-y-auto p-3" id="entregado-column">
                            <!-- Orders will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Nueva Orden Modal -->
    <div id="nueva-orden-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-xl font-medium text-gray-800">Nueva Orden</h3>
                <button class="text-gray-500 hover:text-gray-700" id="cerrar-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="nueva-orden-form" class="p-6">
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2" for="mesa">
                        Número de Mesa
                    </label>
                    <input type="number" id="mesa" name="mesa" min="1" class="form-input w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">
                        Platos
                    </label>
                    
                    <div id="platos-container">
                        <div class="plato-item flex space-x-4 mb-3">
                            <div class="flex-grow">
                                <input type="text" placeholder="Nombre del plato" class="nombre-plato form-input w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <div class="w-24">
                                <input type="number" placeholder="Cant." class="cantidad-plato form-input w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" min="1" value="1" required>
                            </div>
                            <button type="button" class="eliminar-plato text-red-500 hover:text-red-700 disabled:opacity-50">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="button" id="agregar-plato" class="mt-2 text-blue-600 hover:text-blue-800 text-sm flex items-center">
                        <i class="fas fa-plus mr-1"></i>
                        Agregar otro plato
                    </button>
                </div>
                
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="cancelar-orden" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">
                        Cancelar
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                        Crear Orden
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Notifications -->
    <div id="notification" class="notification">
        <i class="fas fa-check-circle mr-2"></i>
        <span id="notification-text"></span>
    </div>
    
    <!-- Sonido Notificación -->
    <audio id="notification-sound" src="https://assets.mixkit.co/active_storage/sfx/933/933-preview.mp3" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.20/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dragula@3.7.3/dist/dragula.min.js"></script>
    <script id="app-script">
        document.addEventListener('DOMContentLoaded', function() {
            // Variables globales
            let currentRole = '';
            let orders = JSON.parse(localStorage.getItem('restaurantOrders')) || [];
            
            // DOM Elements
            const loginScreen = document.getElementById('login-screen');
            const dashboardScreen = document.getElementById('dashboard-screen');
            const roleBadge = document.getElementById('role-badge');
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            const meseroControls = document.getElementById('mesero-controls');
            const nuevaOrdenBtn = document.getElementById('nueva-orden-btn');
            const nuevaOrdenModal = document.getElementById('nueva-orden-modal');
            const cerrarModal = document.getElementById('cerrar-modal');
            const nuevaOrdenForm = document.getElementById('nueva-orden-form');
            const agregarPlatoBtn = document.getElementById('agregar-plato');
            const cancelarOrdenBtn = document.getElementById('cancelar-orden');
            const platosContainer = document.getElementById('platos-container');
            const reloadHistory = document.getElementById('reload-history');
            const logoutButton = document.getElementById('logout-button');
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notification-text');
            const notificationSound = document.getElementById('notification-sound');
            
            // Columnas
            const pendienteColumn = document.getElementById('pendiente-column');
            const preparacionColumn = document.getElementById('preparacion-column');
            const listoColumn = document.getElementById('listo-column');
            const entregadoColumn = document.getElementById('entregado-column');
            const pendienteContainer = document.getElementById('pendiente-container');
            const preparacionContainer = document.getElementById('preparacion-container');
            const listoContainer = document.getElementById('listo-container');
            const entregadoContainer = document.getElementById('entregado-container');
            
            // Selección de rol
            document.querySelectorAll('.role-card').forEach(card => {
                card.addEventListener('click', function() {
                    currentRole = this.dataset.role;
                    loginScreen.classList.add('hidden');
                    dashboardScreen.classList.remove('hidden');
                    
                    configureByRole(currentRole);
                    loadOrders();
                });
            });
            
            // Configurar UI por rol
            function configureByRole(role) {
                if (role === 'mesero') {
                    roleBadge.textContent = 'Mesero';
                    roleBadge.classList.add('bg-blue-100', 'text-blue-800');
                    meseroControls.classList.remove('hidden');
                    entregadoContainer.classList.remove('hidden');
                    
                } else if (role === 'chef') {
                    roleBadge.textContent = 'Chef/Cocina';
                    roleBadge.classList.add('bg-orange-100', 'text-orange-800');
                    meseroControls.classList.add('hidden');
                    entregadoContainer.classList.add('hidden');
                    
                } else if (role === 'servicio') {
                    roleBadge.textContent = 'Servicio al Cliente';
                    roleBadge.classList.add('bg-green-100', 'text-green-800');
                    meseroControls.classList.add('hidden');
                    entregadoContainer.classList.remove('hidden');
                }
            }
            
            // Cargar órdenes desde LocalStorage
            function loadOrders() {
                clearColumns();
                
                orders.forEach(order => {
                    const orderCard = createOrderCard(order);
                    
                    // Colocar en la columna correspondiente
                    switch (order.estado) {
                        case 'pendiente':
                            pendienteColumn.appendChild(orderCard);
                            break;
                        case 'preparacion':
                            preparacionColumn.appendChild(orderCard);
                            break;
                        case 'listo':
                            listoColumn.appendChild(orderCard);
                            break;
                        case 'entregado':
                            if (currentRole !== 'chef') {
                                entregadoColumn.appendChild(orderCard);
                            }
                            break;
                    }
                });
            }
            
            function clearColumns() {
                pendienteColumn.innerHTML = '';
                preparacionColumn.innerHTML = '';
                listoColumn.innerHTML = '';
                entregadoColumn.innerHTML = '';
            }
            
            // Crear tarjeta de orden
            function createOrderCard(order) {
                const card = document.createElement('div');
                card.className = 'card-order bg-white p-4 mb-3 rounded-lg shadow border border-gray-200';
                card.dataset.orderId = order.id;
                
                let stateClass = '';
                if (order.estado === 'pendiente') stateClass = 'text-yellow-500';
                if (order.estado === 'preparacion') stateClass = 'text-orange-500';
                if (order.estado === 'listo') stateClass = 'text-green-500';
                if (order.estado === 'entregado') stateClass = 'text-blue-500';
                
                // Formatear fecha
                const fecha = new Date(order.createdAt);
                const hora = fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                
                // Construir HTML para la lista de platos
                let platosHTML = '<ul class="mt-2 space-y-1">';
                order.platos.forEach(plato => {
                    platosHTML += `<li class="flex justify-between">
                        <span>${plato.nombre}</span>
                        <span class="text-gray-600">x${plato.cantidad}</span>
                    </li>`;
                });
                platosHTML += '</ul>';
                
                // Botones según estado y rol
                let botonesHTML = '';
                
                if (currentRole === 'mesero' && order.estado === 'pendiente') {
                    botonesHTML = `<button class="cancelar-orden text-red-500 hover:text-red-700 text-sm mt-3">
                        <i class="fas fa-times mr-1"></i> Cancelar orden
                    </button>`;
                } else if (currentRole === 'chef') {
                    if (order.estado === 'pendiente') {
                        botonesHTML = `<button class="preparar-orden w-full bg-orange-500 hover:bg-orange-600 text-white py-1 px-3 rounded text-sm mt-3">
                            <i class="fas fa-fire mr-1"></i> Comenzar preparación
                        </button>`;
                    } else if (order.estado === 'preparacion') {
                        botonesHTML = `<button class="finalizar-orden w-full bg-green-500 hover:bg-green-600 text-white py-1 px-3 rounded text-sm mt-3">
                            <i class="fas fa-check mr-1"></i> Marcar como listo
                        </button>`;
                    }
                } else if (currentRole === 'servicio' && order.estado === 'listo') {
                    botonesHTML = `<button class="entregar-orden w-full bg-blue-500 hover:bg-blue-600 text-white py-1 px-3 rounded text-sm mt-3">
                        <i class="fas fa-check-circle mr-1"></i> Marcar como entregada
                    </button>`;
                }
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-medium">Orden #${order.id}</span>
                            <span class="ml-2 text-sm text-gray-500">Mesa ${order.mesa}</span>
                        </div>
                        <span class="text-sm ${stateClass}">
                            <i class="fas fa-circle text-xs mr-1"></i>
                            ${order.estado.charAt(0).toUpperCase() + order.estado.slice(1)}
                        </span>
                    </div>
                    <div class="border-t border-gray-100 my-2"></div>
                    ${platosHTML}
                    <div class="text-xs text-gray-500 mt-2">
                        <i class="far fa-clock mr-1"></i>
                        ${hora}
                    </div>
                    ${botonesHTML}
                `;
                
                // Event listeners para botones de la tarjeta
                setTimeout(() => {
                    const cardElement = document.querySelector(`[data-order-id="${order.id}"]`);
                    
                    if (cardElement) {
                        // Botón de cancelar orden
                        const cancelarBtn = cardElement.querySelector('.cancelar-orden');
                        if (cancelarBtn) {
                            cancelarBtn.addEventListener('click', () => cancelarOrden(order.id));
                        }
                        
                        // Botón de comenzar preparación
                        const prepararBtn = cardElement.querySelector('.preparar-orden');
                        if (prepararBtn) {
                            prepararBtn.addEventListener('click', () => cambiarEstadoOrden(order.id, 'preparacion'));
                        }
                        
                        // Botón de finalizar preparación
                        const finalizarBtn = cardElement.querySelector('.finalizar-orden');
                        if (finalizarBtn) {
                            finalizarBtn.addEventListener('click', () => cambiarEstadoOrden(order.id, 'listo'));
                        }
                        
                        // Botón de entregar orden
                        const entregarBtn = cardElement.querySelector('.entregar-orden');
                        if (entregarBtn) {
                            entregarBtn.addEventListener('click', () => cambiarEstadoOrden(order.id, 'entregado'));
                        }
                    }
                }, 0);
                
                return card;
            }
            
            // Nueva Orden Modal
            nuevaOrdenBtn.addEventListener('click', function() {
                nuevaOrdenModal.classList.remove('hidden');
            });
            
            cerrarModal.addEventListener('click', function() {
                nuevaOrdenModal.classList.add('hidden');
            });
            
            cancelarOrdenBtn.addEventListener('click', function() {
                nuevaOrdenModal.classList.add('hidden');
            });
            
            // Agregar un plato a la orden
            agregarPlatoBtn.addEventListener('click', function() {
                const platoItem = document.createElement('div');
                platoItem.className = 'plato-item flex space-x-4 mb-3';
                
                platoItem.innerHTML = `
                    <div class="flex-grow">
                        <input type="text" placeholder="Nombre del plato" class="nombre-plato form-input w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="w-24">
                        <input type="number" placeholder="Cant." class="cantidad-plato form-input w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" min="1" value="1" required>
                    </div>
                    <button type="button" class="eliminar-plato text-red-500 hover:text-red-700">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                
                platosContainer.appendChild(platoItem);
                
                // Evento para eliminar plato
                platoItem.querySelector('.eliminar-plato').addEventListener('click', function() {
                    platoItem.remove();
                    
                    // Deshabilitar el botón de eliminar si solo queda un plato
                    if (document.querySelectorAll('.plato-item').length === 1) {
                        document.querySelector('.eliminar-plato').disabled = true;
                    }
                });
                
                // Habilitar todos los botones de eliminar si hay más de un plato
                if (document.querySelectorAll('.plato-item').length > 1) {
                    document.querySelectorAll('.eliminar-plato').forEach(btn => {
                        btn.disabled = false;
                    });
                }
            });
            
            // Deshabilitar el botón de eliminar inicial si solo hay un plato
            document.querySelector('.eliminar-plato').disabled = true;
            
            // Crear nueva orden
            nuevaOrdenForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Mostrar indicador de carga
                Swal.fire({
                    title: 'Creando orden...',
                    text: 'Por favor espere',
                    allowOutsideClick: false,
                    showConfirmButton: false,
                    willOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                // Crear array de platos
                const platos = [];
                const platosItems = document.querySelectorAll('.plato-item');
                
                platosItems.forEach(item => {
                    const nombre = item.querySelector('.nombre-plato').value;
                    const cantidad = parseInt(item.querySelector('.cantidad-plato').value);
                    
                    if (nombre && cantidad) {
                        platos.push({
                            nombre: nombre,
                            cantidad: cantidad
                        });
                    }
                });
                
                // Crear objeto de orden
                const newOrder = {
                    id: orders.length > 0 ? Math.max(...orders.map(order => order.id)) + 1 : 1,
                    mesa: parseInt(document.getElementById('mesa').value),
                    platos: platos,
                    estado: 'pendiente',
                    createdAt: new Date().toISOString()
                };
                
                // Agregar a la lista y guardar
                orders.push(newOrder);
                saveOrders();
                
                // Simular tiempo de carga y mostrar mensaje de éxito
                setTimeout(() => {
                    nuevaOrdenModal.classList.add('hidden');
                    nuevaOrdenForm.reset();
                    
                    // Resetear platos
                    platosContainer.innerHTML = `
                        <div class="plato-item flex space-x-4 mb-3">
                            <div class="flex-grow">
                                <input type="text" placeholder="Nombre del plato" class="nombre-plato form-input w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <div class="w-24">
                                <input type="number" placeholder="Cant." class="cantidad-plato form-input w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" min="1" value="1" required>
                            </div>
                            <button type="button" class="eliminar-plato text-red-500 hover:text-red-700 disabled:opacity-50">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    document.querySelector('.eliminar-plato').disabled = true;
                    
                    // Cargar las órdenes actualizadas
                    loadOrders();
                    
                    // Mostrar mensaje de éxito
                    Swal.fire({
                        icon: 'success',
                        title: '¡Orden creada!',
                        text: `Orden #${newOrder.id} creada exitosamente`,
                        timer: 2000,
                        showConfirmButton: false
                    });
                    
                    // Mostrar notificación
                    showNotification(`¡Nueva orden #${newOrder.id} creada!`);
                }, 1000);
            });
            
            // Cambiar estado de una orden
            function cambiarEstadoOrden(orderId, nuevoEstado) {
                // Mostrar indicador de carga
                Swal.fire({
                    title: 'Actualizando orden...',
                    text: 'Por favor espere',
                    allowOutsideClick: false,
                    showConfirmButton: false,
                    willOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                // Buscar la orden
                const orderIndex = orders.findIndex(order => order.id === orderId);
                
                if (orderIndex !== -1) {
                    orders[orderIndex].estado = nuevoEstado;
                    
                    // Guardar órdenes actualizadas
                    saveOrders();
                    
                    // Simular tiempo de carga
                    setTimeout(() => {
                        // Cargar las órdenes actualizadas
                        loadOrders();
                        
                        Swal.fire({
                            icon: 'success',
                            title: '¡Estado actualizado!',
                            text: `Orden #${orderId} actualizada a "${nuevoEstado}"`,
                            timer: 2000,
                            showConfirmButton: false
                        });
                        
                        // Si es orden lista para servir, tocar notificación
                        if (nuevoEstado === 'listo') {
                            notificationSound.play();
                        }
                        
                        // Mostrar notificación
                        showNotification(`Orden #${orderId} actualizada a "${nuevoEstado}"`);
                    }, 1000);
                }
            }
            
            // Cancelar una orden
            function cancelarOrden(orderId) {
                Swal.fire({
                    title: '¿Estás seguro?',
                    text: "¿Deseas cancelar esta orden?",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, cancelar',
                    cancelButtonText: 'No'
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Mostrar indicador de carga
                        Swal.fire({
                            title: 'Cancelando orden...',
                            text: 'Por favor espere',
                            allowOutsideClick: false,
                            showConfirmButton: false,
                            willOpen: () => {
                                Swal.showLoading();
                            }
                        });
                        
                        // Buscar y eliminar la orden
                        const orderIndex = orders.findIndex(order => order.id === orderId);
                        
                        if (orderIndex !== -1) {
                            orders.splice(orderIndex, 1);
                            
                            // Guardar órdenes actualizadas
                            saveOrders();
                            
                            // Simular tiempo de carga
                            setTimeout(() => {
                                // Cargar las órdenes actualizadas
                                loadOrders();
                                
                                Swal.fire({
                                    icon: 'success',
                                    title: '¡Orden cancelada!',
                                    text: `La orden #${orderId} ha sido cancelada`,
                                    timer: 2000,
                                    showConfirmButton: false
                                });
                                
                                // Mostrar notificación
                                showNotification(`Orden #${orderId} cancelada`);
                            }, 1000);
                        }
                    }
                });
            }
            
            // Guardar órdenes en LocalStorage
            function saveOrders() {
                localStorage.setItem('restaurantOrders', JSON.stringify(orders));
            }
            
            // Recargar historial
            reloadHistory.addEventListener('click', function() {
                Swal.fire({
                    title: 'Recargando historial...',
                    text: 'Por favor espere',
                    allowOutsideClick: false,
                    showConfirmButton: false,
                    willOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                // Simular tiempo de carga
                setTimeout(() => {
                    orders = JSON.parse(localStorage.getItem('restaurantOrders')) || [];
                    loadOrders();
                    
                    Swal.fire({
                        icon: 'success',
                        title: '¡Historial recargado!',
                        timer: 1500,
                        showConfirmButton: false
                    });
                }, 1000);
            });
            
            // Cerrar sesión
            logoutButton.addEventListener('click', function() {
                Swal.fire({
                    title: '¿Cerrar sesión?',
                    text: "¿Deseas salir del sistema?",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, salir',
                    cancelButtonText: 'No'
                }).then((result) => {
                    if (result.isConfirmed) {
                        dashboardScreen.classList.add('hidden');
                        loginScreen.classList.remove('hidden');
                        currentRole = '';
                    }
                });
            });
            
            // Menú móvil
            mobileMenuButton.addEventListener('click', function() {
                if (mobileMenu.classList.contains('hidden')) {
                    mobileMenu.classList.remove('hidden');
                } else {
                    mobileMenu.classList.add('hidden');
                }
            });
            
            // Función para mostrar notificaciones
            function showNotification(message) {
                notificationText.textContent = message;
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            // Inicializar Drag and Drop para el chef
            function initDragula() {
                if (currentRole === 'chef') {
                    dragula([
                        pendienteColumn,
                        preparacionColumn,
                        listoColumn
                    ]).on('drop', function(el, target, source) {
                        const orderId = parseInt(el.dataset.orderId);
                        
                        if (target === pendienteColumn) {
                            cambiarEstadoOrden(orderId, 'pendiente');
                        } else if (target === preparacionColumn) {
                            cambiarEstadoOrden(orderId, 'preparacion');
                        } else if (target === listoColumn) {
                            cambiarEstadoOrden(orderId, 'listo');
                        }
                    });
                }
            }
            
            // Datos iniciales de ejemplo (si no hay datos)
            function loadSampleData() {
                if (orders.length === 0) {
                    orders = [
                        {
                            id: 1,
                            mesa: 3,
                            platos: [
                                { nombre: "Hamburguesa Especial", cantidad: 2 },
                                { nombre: "Papas fritas", cantidad: 1 }
                            ],
                            estado: "pendiente",
                            createdAt: new Date().toISOString()
                        },
                        {
                            id: 2,
                            mesa: 5,
                            platos: [
                                { nombre: "Pizza Margarita", cantidad: 1 },
                                { nombre: "Ensalada César", cantidad: 1 },
                                { nombre: "Refresco", cantidad: 2 }
                            ],
                            estado: "preparacion",
                            createdAt: new Date().toISOString()
                        },
                        {
                            id: 3,
                            mesa: 2,
                            platos: [
                                { nombre: "Pasta Carbonara", cantidad: 1 },
                                { nombre: "Tiramisú", cantidad: 1 }
                            ],
                            estado: "listo",
                            createdAt: new Date().toISOString()
                        },
                        {
                            id: 4,
                            mesa: 1,
                            platos: [
                                { nombre: "Sopa de tomate", cantidad: 1 },
                                { nombre: "Pollo asado", cantidad: 1 },
                                { nombre: "Agua mineral", cantidad: 1 }
                            ],
                            estado: "entregado",
                            createdAt: new Date().toISOString()
                        }
                    ];
                    
                    saveOrders();
                }
            }
            
            // Cargar datos de ejemplo
            loadSampleData();
            
            // Click fuera del modal para cerrarlo
            window.addEventListener('click', function(event) {
                if (event.target === nuevaOrdenModal) {
                    nuevaOrdenModal.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
